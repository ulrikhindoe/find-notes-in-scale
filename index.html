<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Notes in Scale</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Find Notes in Scale</h1>
    <div id="controls">
        <label for="delaySelect">Delay (seconds):</label>
        <select id="delaySelect">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <label for="degreeCount">Number of Degrees:</label>
        <input type="number" id="degreeCount" value="20" min="1" max="100">
    </div>
    <div id="buttons">
        <button id="randomKeyButton">Pick Random Key</button>
        <button id="startButton">Start</button>
        <button id="stopButton">Stop</button>
    </div>
    <div id="currentKey">Current Key: None</div>
    <div id="output"></div>
    <script src="script.js"></script>
</body>
</html>
