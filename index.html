<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Notes in Scale</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Find Notes in Scale</h1>
    <div id="buttons">
        <button id="randomKeyButton">Pick Random Key</button>
        <button id="startButton">Start</button>
        <button id="stopButton">Stop</button>
    </div>
    <div id="currentKey">Current Key: None</div>
    <div id="progress">Progress: 0/0</div>
    <div id="output"></div>
    <section id="settings">
        <h2>Settings</h2>
        <div id="controls">
            <label for="delaySelect">Delay (seconds):</label>
            <input type="number" id="delaySelect" step="0.1" min="0.1" max="5" value="3">
            <label for="stepCount">Number of steps:</label>
            <input type="number" id="stepCount" value="20" min="1" max="100">
            <div>
                <label for="playSound">Play Sound:</label>
                <select id="playSound">
                    <option value="true">Yes</option>
                    <option value="false" selected>No</option>
                </select>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
